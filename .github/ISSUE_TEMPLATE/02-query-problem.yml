name: รายงานปัญหา Query
description: รายงาน error หรือผลลัพธ์ที่ผิดปกติจาก query ใน repository นี้
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ขอบคุณที่ช่วยรายงานปัญหา รายงานของท่านช่วยให้ query แม่นยำขึ้นสำหรับทุกโรงพยาบาล
        ข้อควรระวัง: ห้ามวางรายชื่อผู้ป่วย, HN, CID หรือข้อมูลรายบุคคลใด ๆ ให้วางเฉพาะตัวเลขรวม (aggregate) เท่านั้น
  - type: input
    id: query-path
    attributes:
      label: path ของ query
      description: โฟลเดอร์ของ query ที่พบปัญหา
      placeholder: queries/mch-anc/maternal-anemia
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: รุ่น HOSxP และรุ่น MySQL/MariaDB
      description: ดูรุ่น database ได้จากคำสั่ง SELECT VERSION();
      placeholder: "เช่น HOSxP v3, MariaDB 10.4"
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: อาการ
      description: วาง error message ที่ได้ หรืออธิบายผลที่ได้เทียบกับผลที่คาดหวัง โดยวางเฉพาะตัวเลขรวม (aggregate) เช่น จำนวนแถว จำนวนราย ห้ามวางรายชื่อหรือ HN ผู้ป่วยจริง
      placeholder: |
        เช่น รัน hosxp.sql แล้วได้ error ...
        หรือ query นับได้ 120 ราย แต่ HDC แสดง 96 ราย
    validations:
      required: true
  - type: checkboxes
    id: confirm-no-patient-data
    attributes:
      label: การยืนยันเรื่องข้อมูลผู้ป่วย
      options:
        - label: ข้าพเจ้ายืนยันว่าไม่มีข้อมูลผู้ป่วยจริงในรายงานนี้ มีเฉพาะตัวเลขรวม (aggregate) เท่านั้น
          required: true
